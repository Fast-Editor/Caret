ShortDescription: A Cursor-class AI code editor with a Rust core.
Description: |-
  Caret is a memory-efficient, Rust-powered AI code editor built on Tauri 2 and Monaco. It ships Tab completions,
  inline edits with a streaming diff, an agent with real tools, a local codebase index, MCP, a Debug Adapter Protocol
  client, a semantic terminal and a command safety layer, and it runs Claude Code, Codex, Cursor, Grok Build,
  Gemini CLI, OpenCode, Pi or any Agent Client Protocol agent with your own subscriptions and API keys. No bundled
  Chromium, no Node at run time.

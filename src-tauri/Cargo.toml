[package]
name = "caret"
version = "0.1.0"
description = "Caret — a memory-efficient, Rust-powered AI code editor"
authors = ["Caret contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "caret_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# --- shell ---
tauri = { version = "2.12", features = ["devtools", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-process = "2.4"
tauri-plugin-os = "2.4"
tauri-plugin-updater = "2"
# --- runtime / utils ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec", "rt"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }
dashmap = "6"
parking_lot = "0.13"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
regex = "1"
base64 = "0.23"
blake3 = "1"
lru = "0.19"
tempfile = "3"
url = "2"
which = "8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# --- files / search ---
ignore = "0.4"
walkdir = "2"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "8"
notify-debouncer-full = "0.7"
trash = "5"
mime_guess = "2"
encoding_rs = "0.8"
content_inspector = "0.2"
similar = { version = "3", features = ["inline", "unicode"] }
# --- git / terminal ---
git2 = { version = "0.21", default-features = false }
portable-pty = "0.9"
# --- AI / network ---
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli", "charset", "http2", "system-proxy"] }
eventsource-stream = "0.2"
# --- auto router (Lynkr sidecar + loopback bridge) ---
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
html2text = "0.17"
# --- indexing ---
tantivy = "0.27"
# --- mcp ---
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "client-side-sse", "reqwest", "macros"] }

[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
